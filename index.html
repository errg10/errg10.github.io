<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistec MX - Catálogo</title>
    
    <!-- REDIRECCIÓN AUTOMÁTICA después de 0 segundos -->
    <meta http-equiv="refresh" content="0; url=/SISTEC_Services_Catalog.pdf">
    
    <!-- Mensaje por si la redirección falla -->
    <script>
        window.onload = function() {
            // Redirigir inmediatamente
            window.location.href = "/SISTEC_Services_Catalog.pdf";
            
            // O después de 3 segundos si quieres dar tiempo
            // setTimeout(function() {
            //     window.location.href = "/catalogo.pdf";
            // }, 3000);
        };
    </script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Sistec MX</h1>
    <p>Redirigiendo al catálogo...</p>
    
    <!-- Loader animado -->
    <div class="loader"></div>
    
    <p>Si la redirección no funciona automáticamente, 
       <a href="/SISTEC_Services_Catalog.pdf">haz clic aquí para ver el catálogo</a>.
    </p>
    
    <!-- Redundancia: también con JavaScript -->
    <script>
        // Primera redirección
        setTimeout(function() {
            window.location.href = "/SISTEC_Services_Catalog.pdf";
        }, 100);
        
        // Segunda redirección por si falla la primera
        setTimeout(function() {
            if (window.location.pathname !== "/SISTEC_Services_Catalog.pdf") {
                window.location.href = "/SISTEC_Services_Catalog.pdf";
            }
        }, 2000);
    </script>
</body>
</html>
